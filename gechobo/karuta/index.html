<!DOCTYPE html>
<html lang="ja" data-theme="cream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ゲチョボ⭐︎かるた 読み札サイト</title>
<style>
  /* ダブルタップズーム無効化（iOS Safariはuser-scalable=noを無視するため） */
  html, body { touch-action: manipulation; }
  /* ===== テーマ定義（色の検討用） ===== */
  :root, [data-theme="cream"] {
    --paper: #f6f1e7;
    --paper-deep: #efe7d6;
    --glow: #fbf7ec;
    --ink: #2a251d;
    --ink-soft: #6f6455;
    --line: #ddd2bd;
    --accent: #bc3f2a;
    --accent-dark: #a03322;
    --accent-shadow: rgba(160, 60, 35, 0.30);
    --card-bg: #fffdf8;
    --card-ink: #2a251d;
    --card-soft: #6f6455;
    --card-line: #ddd2bd;
    --panel-bg: rgba(255, 253, 248, 0.65);
    --list-bg: #ffffff;
    --list-line: #e9e1cf;
    --group-bg: #faf0e8;
    --group-ink: #a03322;
    --track: #e9e0cb;
    --track-active: #fffdf8;
    --progress-track: #e7ddc9;
    --empty: #b3a68d;
  }
  html {
    /* スクロールバーの有無で横幅が変わらないように、バーの溝を常に確保する */
    scrollbar-gutter: stable;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: clip;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--paper);
    background-image: radial-gradient(ellipse at 20% 10%, var(--glow) 0%, var(--paper) 55%, var(--paper-deep) 100%);
    color: var(--ink);
    box-sizing: border-box;
    transition: background-color 0.3s, color 0.3s;
  }
  *, *:before, *:after { box-sizing: inherit; }
  body { padding: 16px 12px 32px; }

  .container { width: 100%; max-width: 460px; margin: 0 auto; }

  /* ===== 読み札：高さ固定（改行でUIが動かない） ===== */
  .card-display {
    background: var(--card-bg);
    border: 1px solid var(--card-line);
    border-radius: 6px;
    height: min(calc(50vh + 92px), 680px);
    padding: 30px 22px 18px;
    margin-bottom: 16px;
    box-shadow: 0 10px 24px rgba(60, 45, 20, 0.15), 0 2px 5px rgba(60, 45, 20, 0.08);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .card-display::before {
    content: "読み札";
    position: absolute;
    top: 10px; left: 14px;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--card-soft);
  }
  .voice-btn {
    position: absolute;
    top: 10px; right: 12px;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--card-line);
    background: var(--card-bg);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(60, 45, 20, 0.14);
    z-index: 2;
  }
  .voice-btn[hidden] { display: none; }
  .voice-btn:active { transform: scale(0.94); }
  .card-main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 0;
  }
  .card-image {
    max-width: 100%;
    max-height: 100%;
    border-radius: 4px;
    display: none;
    object-fit: contain;
  }
  .card-text {
    max-width: 100%;
    font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 23px;
    font-weight: 600;
    color: var(--card-ink);
    line-height: 1.65;
    letter-spacing: 0.04em;
    text-align: center;
    word-break: break-all;
    animation: cardIn 0.35s ease-out;
  }
  .card-text.long { font-size: 18px; line-height: 1.7; }
  .card-text.xlong { font-size: 15px; line-height: 1.7; }
  .empty-text {
    font-family: inherit;
    color: var(--empty);
    font-size: 14px;
    font-weight: normal;
    letter-spacing: 0.08em;
  }
  .card-subtext {
    font-size: 11px;
    color: var(--card-soft);
    border-top: 1px dashed var(--card-line);
    padding-top: 8px;
    margin-top: 10px;
    width: 100%;
    height: 58px;
    line-height: 1.5;
    text-align: center;
    visibility: hidden;
  }
  .card-subtext.show { visibility: visible; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px) scale(0.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== 操作ボタン ===== */
  .btn-group { display: flex; gap: 10px; margin-bottom: 12px; }
  .btn {
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.08s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    flex: 1;
    padding: 17px 12px;
    font-size: 17px;
    letter-spacing: 0.15em;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 10px var(--accent-shadow);
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-reset {
    padding: 17px 18px;
    font-size: 14px;
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }

  /* ===== 持ち札設定：開いた分だけ高さが伸びる ===== */
  .wave-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px; }
  .wave-chip {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 6px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card-bg);
    font-size: 13.5px; font-weight: bold;
    color: var(--ink);
    cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  .wave-chip.disabled { opacity: 0.45; cursor: default; }
  .wave-chip .soon { font-size: 10px; font-weight: normal; color: var(--ink-soft); }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }

.back-link { display: inline-block; margin: 2px 0 12px; font-size: 13px; letter-spacing: 0.14em; color: #fff; background: #d32d25; text-decoration: none; border: none; border-radius: 999px; padding: 9px 22px; }
</style>
</head>
<body>

<div class="container">
  <a class="back-link" href="../">← ゲチョボ☆魂のページへ</a>
  <!-- 読み札エリア（高さ固定） -->
  <div class="card-display">
    <button id="voiceBtn" class="voice-btn" type="button" aria-label="本人の声で聞く" hidden>🔊</button>
    <div class="card-main">
      <img id="cardImage" class="card-image" src="" alt="札の画像">
      <div class="card-text empty-text" id="displayText">「次の札を引く」を押してください</div>
    </div>
    <div class="card-subtext" id="cardSubtext"></div>
  </div>

  <!-- 操作ボタン -->
  <div class="btn-group">
    <button class="btn btn-primary" id="drawBtn">次の札を引く</button>
    <button class="btn btn-reset" id="resetBtn">リセット</button>
  </div>

  <!-- 使用する札の選択 -->
  <div class="wave-row" id="waveRow">
    <!-- JSで動的生成 -->
  </div>
</div>

<script>
  const cardsData = {
    1: [
      { text: "ゲチョボ⭐︎魂", img: "cards/w1-01.jpg" },
      { text: "マジカルバナナ バナナといったら運命", img: "cards/w1-02.jpg" },
      { text: "ホワイトノイズvsブラックノイズvs梅子さん(82)", img: "cards/w1-03.jpg" },
      { text: "オペラ風かえるの歌", img: "cards/w1-04.jpg" },
      { text: "寝る前に「ファッ、ファッ、ホァッ、ディエン！！ディエン！！」って言うと良いと思います。", img: "cards/w1-05.jpg" },
      { text: "500(ごっぴゃく)メートル先、幸福", img: "cards/w1-06.jpg" },
      { text: "うさぎのうーたん 居(お)らん。 オランウータン", img: "cards/w1-07.jpg" },
      { text: "おしっこボンボヤージュ", img: "cards/w1-08.jpg" },
      { text: "ディメンション反復横跳び", img: "cards/w1-09.jpg" },
      { text: "私のお名前はちゃんぽんマン啓三。金魚裏返し太郎でもある", img: "cards/w1-10.jpg" },
      { text: "脇にお茶を注がないでね。", img: "cards/w1-11.jpg" },
      { text: "ぴちょれ パたぱてゃ ギョリマヌ空師", img: "cards/w1-12.jpg" },
      { text: "絡まった ホットケーキ 逆ピカソ", img: "cards/w1-13.jpg" },
      { text: "ほがらカラス ピッショ・黒味ちゃん たまごみたい", img: "cards/w1-14.jpg" },
      { text: "ぱんろっちょ 今宵は在してる？区分によっては、そう。", img: "cards/w1-15.jpg" },
      { text: "50円のソフトクリーム 後輩に買ってやる いいよ、いいよ。先輩が出すもんだし", img: "cards/w1-16.jpg" },
      { text: "然被(もひ)する", img: "cards/w1-17.jpg" },
      { text: "ングングングングンカカカカ漢方第二公園", img: "cards/w1-18.jpg" },
      { text: "クオリティ重視の立ち食い蕎麦", img: "cards/w1-19.jpg" },
      { text: "効率重視のニート", img: "cards/w1-20.jpg" },
      { text: "プン仏", img: "cards/w1-21.jpg" },
      { text: "犬のひげを認識したら勝ち。猫のベロと目があったら負け", img: "cards/w1-22.jpg" },
      { text: "どうしてチクチク言葉をロココ調に美しくするの？", img: "cards/w1-23.jpg" },
      { text: "ポロポロ落ちる海苔の破片は床のタイルを活気づけ、重力のままに舞う、スズメが食らい、翁はこき、私が笑む。精神が加速するサイクルとはこれを指す。", img: "cards/w1-24.jpg" },
      { text: "クロワッサンの発音むずいから「からし」って言うね。", img: "cards/w1-25.jpg" },
      { text: "あなたの足を引っ張ろうとする人がいるなら、それは肉アレイです。筋トレだね", img: "cards/w1-26.jpg" },
      { text: "全校集会中 息を止める遊びをしてた奴、全員一軍ね", img: "cards/w1-27.jpg" },
      { text: "硬軟骨ヘルニア！！", img: "cards/w1-28.jpg" },
      { text: "アホアホ学校、歩道橋観察会(年13回)", img: "cards/w1-29.jpg" },
      { text: "灰色になったら柱（ぱしら）に説教しよう", img: "cards/w1-30.jpg" }
    ],
    2: [
      // 第2弾を追加する場合はここに同じ形式で書き足してください
    ]
  };

  let activeDeck = [];
  let selectedCards = [];
  let currentCard = null;

  const drawBtn = document.getElementById('drawBtn');
  const resetBtn = document.getElementById('resetBtn');
  const displayText = document.getElementById('displayText');
  const cardSubtext = document.getElementById('cardSubtext');
  const cardImage = document.getElementById('cardImage');
  const voiceBtn = document.getElementById('voiceBtn');
  const voiceAudio = new Audio();

  const waveRow = document.getElementById('waveRow');

  function initWaves() {
    waveRow.innerHTML = '';
    [1, 2, 3].forEach(n => {
      const count = (cardsData[n] || []).length;
      const label = document.createElement('label');
      label.className = 'wave-chip' + (count === 0 ? ' disabled' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.wave = n;
      cb.checked = (n === 1 && count > 0);
      cb.disabled = (count === 0);
      cb.addEventListener('change', resetGame);
      label.appendChild(cb);
      label.appendChild(document.createTextNode('第' + n + '弾'));
      if (count === 0) {
        const soon = document.createElement('span');
        soon.className = 'soon';
        soon.textContent = '準備中';
        label.appendChild(soon);
      }
      waveRow.appendChild(label);
    });
    resetGame();
  }

  function updateSelectedCards() {
    selectedCards = [];
    waveRow.querySelectorAll('input[type="checkbox"][data-wave]').forEach(cb => {
      if (!cb.checked) return;
      const n = Number(cb.dataset.wave);
      (cardsData[n] || []).forEach((card, idx) => {
        selectedCards.push(Object.assign({}, card, {
          voice: 'audio/w' + n + '-' + String(idx + 1).padStart(2, '0') + '.mp3'
        }));
      });
    });
  }

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function resetGame() {
    currentCard = null;
    voiceAudio.pause();
    voiceBtn.hidden = true;
    updateSelectedCards();
    activeDeck = shuffle(selectedCards);

    cardImage.style.display = 'none';
    cardSubtext.classList.remove('show');
    cardSubtext.textContent = '';
    displayText.style.display = 'block';
    displayText.className = 'card-text empty-text';
    displayText.textContent = selectedCards.length === 0
      ? '使用する弾が選択されていません'
      : '「次の札を引く」を押してください';
  }

  function drawCard() {
    if (selectedCards.length === 0) {
      alert('使用する弾を1つ以上チェックしてください。');
      return;
    }

    if (activeDeck.length === 0) {
      currentCard = null;
      voiceAudio.pause();
      voiceBtn.hidden = true;
      cardImage.style.display = 'none';
      cardSubtext.classList.remove('show');
      displayText.style.display = 'block';
      displayText.className = 'card-text empty-text';
      displayText.textContent = 'すべての読み札が終わりました';
      return;
    }

    const drawnCard = activeDeck.pop();
    currentCard = drawnCard;
    voiceAudio.pause();
    refreshVoiceBtn();

    if (drawnCard.img && drawnCard.img.trim() !== "") {
      cardImage.src = drawnCard.img;
      cardImage.alt = drawnCard.text;
      cardImage.style.display = 'block';
      displayText.style.display = 'none';
    } else {
      cardImage.style.display = 'none';
      displayText.style.display = 'block';
      const len = drawnCard.text.length;
      displayText.className = 'card-text' + (len > 90 ? ' xlong' : len > 40 ? ' long' : '');
      displayText.textContent = drawnCard.text;
      displayText.style.animation = 'none';
      void displayText.offsetWidth;
      displayText.style.animation = '';
    }

    cardSubtext.textContent = drawnCard.text;
    cardSubtext.classList.add('show');
  }

  /* 本人の声：この札の音声がある時だけボタンを出す */
  function refreshVoiceBtn() {
    voiceBtn.hidden = true;
    if (!currentCard || !currentCard.voice) return;
    const target = currentCard;
    fetch(target.voice, { method: 'HEAD' })
      .then(r => { if (r.ok && currentCard === target) voiceBtn.hidden = false; })
      .catch(() => {});
  }
  voiceBtn.addEventListener('click', () => {
    if (!currentCard || !currentCard.voice) return;
    voiceAudio.src = currentCard.voice;
    voiceAudio.currentTime = 0;
    voiceAudio.play().catch(() => {});
  });

  drawBtn.addEventListener('click', drawCard);
  resetBtn.addEventListener('click', resetGame);

  initWaves();
</script>

</body>
</html>
