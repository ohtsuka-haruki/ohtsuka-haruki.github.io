<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さんぽみち | 大塚陽暉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
    background: #fff; color: #1e1e1e;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px 64px;
    line-break: strict;
  }
  .keep { display: inline-block; white-space: nowrap; }
  .path-line { width: 0; height: 48px; border-left: 2px dashed #cfc9bd; margin: 16px auto 0; }
  .path-line + .frame { margin-top: 12px; }
  .path-line + .route { margin-top: 16px; }
  .path-line + .lyric { margin-top: 16px; }
  .path-line + .mv-note { margin-top: 14px; }
  .path-line + .home-row { margin-top: 16px; }
  h1 { font-size: clamp(22px, 4.4vw, 32px); font-weight: 500; letter-spacing: .1em; text-shadow: 0 0 14px rgba(70,70,70,0.38), 0 0 34px rgba(70,70,70,0.20); }
  .title-card {
    position: sticky; top: 0; z-index: 5;
    width: 100%; max-width: 640px; margin: 0 auto;
    background: #fff; border: 1px solid #e5e5e5; box-shadow: 0 2px 14px rgba(0,0,0,0.05);
    text-align: center; padding: 22px 16px 18px;
  }
  .credit { margin-top: 10px; font-size: 13px; color: #6e6e6e; letter-spacing: .08em; }
  .framing { margin-top: 18px; font-size: 17px; font-weight: 600; color: #5a5a5a; letter-spacing: .06em; line-height: 2; text-align: center; }
  .bgm-btn { position: fixed; top: 16px; right: 16px; z-index: 10; width: 52px; height: 52px; border-radius: 50%; border: 1px solid #1e1e1e; background: #fff; color: #1e1e1e; font-size: 20px; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .bgm-btn.on { background: #1e1e1e; color: #fff; }
  .route { margin-top: 48px; width: 100%; max-width: 640px; font-size: 14px; font-weight: 600; color: #5a5a5a; letter-spacing: .06em; border: 1px solid #d9d9d9; padding: 22px 24px; }
  .route-title { font-size: 14px; font-weight: 600; color: #333; letter-spacing: .12em; margin-bottom: 12px; }
  .route-row { display: flex; line-height: 2; }
  .route-date { flex: 0 0 6.8em; }
  .frame {
    margin-top: 36px; width: 100%; max-width: 880px;
    border: 2px solid #282828; padding: 6px;
  }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border: 1px solid #b4b4b4; overflow: hidden; background: #000;
  }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .buttons { margin-top: 34px; display: flex; justify-content: center; }
  .btn { background: none; border: none; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .btn .label { font-size: 15px; color: #1e1e1e; letter-spacing: .1em; }
  .loop-pill {
    height: 56px; min-width: 168px; padding: 0 26px; border-radius: 999px;
    border: 3px solid #1e1e1e; background: #fff; color: #1e1e1e;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 17px; letter-spacing: .1em;
  }
  .loop-pill .dot { width: 11px; height: 11px; border-radius: 50%; background: #c9c9c9; }
  .loop-on .loop-pill { background: #1e1e1e; color: #fff; }
  .loop-on .loop-pill .dot { background: #fff; }
  .note { margin-top: 14px; font-size: 12.5px; color: #8a8a8a; letter-spacing: .06em; text-align: center; line-height: 1.9; }
  .lyric { margin-top: 48px; width: 100%; max-width: 640px; }
  .card-title { margin-bottom: 16px; font-size: 14px; color: #333; letter-spacing: .16em; text-align: center; }
  .card-title::before { content: ""; display: block; width: 28px; height: 1px; background: #c9c9c9; margin: 0 auto 14px; }
  .paper { box-shadow: 0 8px 28px rgba(0,0,0,.13); }
  .lyric img { width: 100%; height: auto; display: block; }
  .mv-note { margin-top: 40px; font-size: 13px; color: #6e6e6e; letter-spacing: .08em; text-align: center; }
  .home-row { margin-top: 48px; }
  .home-btn { display: inline-block; padding: 12px 36px; border: 1px solid #b4b4b4; border-radius: 999px; color: #5a5a5a; font-size: 13px; letter-spacing: .14em; text-decoration: none; transition: border-color .25s, color .25s; }
  .home-btn:hover { border-color: #1e1e1e; color: #1e1e1e; }
  @media (max-width: 480px) {
    .route { padding: 20px 16px; font-size: 13px; letter-spacing: .04em; }
    .route-date { flex-basis: 6.4em; }
  }
  @media (max-width: 340px) {
    .framing { font-size: 15px; }
  }
</style>
</head>
<body>
  <button class="bgm-btn" id="bgmBtn" aria-label="インストBGM切り替え">♪</button>
  <audio id="bgm" src="sanpomichi_instrumental_web.mp3" loop preload="auto"></audio>
  <div class="title-card">
    <h1>さんぽみち</h1>
    <div class="credit">作詞・作曲　大塚陽暉</div>
  </div>
  <p class="framing"><span class="keep">大学生のうちに、</span><span class="keep">初めて一人で作詞作曲した曲です。</span><br><span class="keep">昔の自分を癒すために作りました。</span></p>

  <div class="path-line" aria-hidden="true"></div>
  <div class="frame">
    <div class="stage" id="stage">
      <div id="player"></div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn" id="loopBtn" aria-label="ループ切り替え">
      <span class="loop-pill">ループ<span class="dot"></span></span>
      <span class="label">ループ</span>
    </button>
  </div>
  <p class="note"><span class="keep">ループONのとき、</span><span class="keep">終わると先頭から流れ続けます</span></p>

  <div class="path-line" aria-hidden="true"></div>
  <div class="route">
    <p class="route-title">完成までの道すじ</p>
    <p class="route-row"><span class="route-date">2024.2.9</span><span>八王子駅でメロディが降ってくる</span></p>
    <p class="route-row"><span class="route-date">2025.8.5</span><span>曲の形が固まる</span></p>
    <p class="route-row"><span class="route-date">2026.8.17</span><span>試作ができる</span></p>
    <p class="route-row"><span class="route-date">2026.11.14</span><span>完成</span></p>
    <p class="route-row"><span class="route-date">2026.11.28</span><span>公開</span></p>
  </div>

  <div class="path-line" aria-hidden="true"></div>
  <div class="lyric">
    <img src="sanpomichi_lyric_card_clean.png" alt="『さんぽみち』歌詞カード">
  </div>

  <div class="path-line" aria-hidden="true"></div>
  <div class="lyric">
    <p class="card-title">録音時に書き込んだメモ</p>
    <img class="paper" src="sanpomichi_lyric_card_annotated.png" alt="『さんぽみち』歌詞カード（書き込みあり）">
  </div>

  <div class="path-line" aria-hidden="true"></div>
  <p class="mv-note"><span class="keep">2027年の梅雨の頃に、</span><span class="keep">MVを公開予定です。</span></p>

  <div class="path-line" aria-hidden="true"></div>
  <p class="home-row"><a class="home-btn" href="../index.html">ホームへ戻る</a></p>

<script>
  // ★ 公開前にここだけ差し替える：『さんぽみち』限定公開動画のID（11文字）
  var VIDEO_ID = 'hXouq1H6Qv0';
  var player = null, loopOn = false;

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: VIDEO_ID,
      host: 'https://www.youtube-nocookie.com',
      playerVars: {
        rel: 0, modestbranding: 1, playsinline: 1,
        iv_load_policy: 3
      },
      events: { onStateChange: onState }
    });
  }

  function onState(e) {
    if (e.data === YT.PlayerState.PLAYING && bgmOn) {
      setBgm(false);
    }
    if (e.data === YT.PlayerState.ENDED && loopOn) {
      player.seekTo(0);
      player.playVideo();
    }
  }

  document.getElementById('loopBtn').addEventListener('click', function () {
    loopOn = !loopOn;
    document.body.classList.toggle('loop-on', loopOn);
  });

  // インストBGM（右上のボタン）：クリック起点で <audio> を直接再生する
  var bgm = document.getElementById('bgm');
  var bgmBtn = document.getElementById('bgmBtn');
  var bgmOn = false;
  bgm.volume = 0.25;

  function setBgm(on) {
    bgmOn = on;
    bgmBtn.classList.toggle('on', on);
    if (on) {
      bgm.play();
    } else {
      bgm.pause();
    }
  }

  bgmBtn.addEventListener('click', function () {
    setBgm(!bgmOn);
  });
</script>
</body>
</html>
