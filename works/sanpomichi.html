<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さんぽみち | 大塚陽暉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
    background: #f5f5f4; color: #1e1e1e;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 16px 64px;
    line-break: strict;
  }
  .keep { display: inline-block; white-space: nowrap; }
  h1 { font-size: clamp(22px, 4.4vw, 32px); font-weight: 500; letter-spacing: .1em; text-shadow: 0 0 14px rgba(70,70,70,0.38), 0 0 34px rgba(70,70,70,0.20); }
  .title-card {
    position: sticky; top: 0; z-index: 5;
    width: calc(100% + 32px); margin: 0 -16px;
    background: #fff; border-bottom: 1px solid #e5e5e5; box-shadow: 0 2px 14px rgba(0,0,0,0.05);
    text-align: center; padding: 22px 16px 18px;
  }
  .credit { margin-top: 10px; font-size: 13px; color: #6e6e6e; letter-spacing: .08em; }
  .invite { margin-top: 30px; font-size: 13px; color: #6e6e6e; letter-spacing: .08em; text-align: center; }
  .invite + .frame { margin-top: 16px; }
  .framing { margin-top: 40px; font-size: 14px; font-weight: 400; color: #767676; letter-spacing: .06em; line-height: 2; text-align: center; }
  .bgm-btn { position: absolute; top: 50%; right: 16px; transform: translateY(-50%); z-index: 10; width: 52px; height: 52px; border-radius: 50%; border: 1px solid #1e1e1e; background: #fff; color: #1e1e1e; font-size: 20px; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .bgm-btn.on { background: #1e1e1e; color: #fff; }
  .route { margin-top: 48px; width: 100%; max-width: 640px; font-size: 14px; font-weight: 600; color: #5a5a5a; letter-spacing: .06em; background: #fff; border: 1px solid #d9d9d9; padding: 22px 24px; }
  .route-title { font-size: 14px; font-weight: 600; color: #333; letter-spacing: .12em; margin-bottom: 12px; }
  .route-row { display: flex; line-height: 2; }
  .route-date { flex: 0 0 6.8em; }
  .frame {
    margin-top: 36px; width: 100%; max-width: 880px;
  }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    overflow: hidden; background: #000;
  }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .buttons { margin-top: 34px; display: flex; justify-content: center; }
  .btn { background: none; border: none; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .loop-pill {
    min-width: 118px; padding: 10px 22px; border-radius: 999px;
    border: 2px solid #1e1e1e; background: #fff; color: #1e1e1e;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; letter-spacing: .1em;
  }
  .loop-on .loop-pill { background: #1e1e1e; color: #fff; }
  .lyric { margin-top: 48px; width: 100%; max-width: 640px; }
  .card-title { margin-bottom: 16px; font-size: 14px; color: #333; letter-spacing: .16em; text-align: center; }
  .card-title::before { content: ""; display: block; width: 28px; height: 1px; background: #c9c9c9; margin: 0 auto 14px; }
  .paper { box-shadow: 0 8px 28px rgba(0,0,0,.13); }
  .lyric img { width: 100%; height: auto; display: block; }
  .mv-note { margin-top: 40px; font-size: 13px; color: #6e6e6e; letter-spacing: .08em; text-align: center; }
  .footprint { margin-top: 48px; text-align: center; }
  .footprint-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px; border-radius: 999px; border: 2px solid #c4c4c4; background: #fff; color: #8a8a8a; font-family: inherit; font-size: 15px; letter-spacing: .1em; cursor: pointer; transition: all .25s; }
  .footprint-btn svg { width: 19px; height: 19px; fill: currentColor; flex: 0 0 auto; }
  .footprint-btn:hover { border-color: #9a9a9a; color: #6e6e6e; }
  .footprint-btn.done, .footprint-btn.done:hover { background: #e60012; border-color: #e60012; color: #fff; cursor: default; }
  .footprint-count { margin-top: 14px; font-size: 13px; color: #6e6e6e; letter-spacing: .08em; }
  .home-row { margin-top: 48px; }
  .home-btn { display: inline-block; padding: 16px 46px; border: 1px solid #e60012; border-radius: 999px; background: #e60012; color: #fff; font-size: 15.5px; letter-spacing: .12em; text-decoration: none; transition: all .25s; }
  .home-btn:hover { background: #b3241c; border-color: #b3241c; color: #fff; }
  @media (max-width: 480px) {
    .frame { width: calc(100% + 24px); }
    .title-card h1 { font-size: 35px; }
    .route { padding: 20px 16px; font-size: 13px; letter-spacing: .04em; }
    .route-date { flex-basis: 6.4em; }
  }
  @media (max-width: 340px) {
    .framing { font-size: 13px; }
  }
</style>
</head>
<body>
  <audio id="bgm" src="sanpomichi_instrumental_web.mp3" loop preload="auto"></audio>
  <div class="title-card">
    <h1>さんぽみち</h1>
    <button class="bgm-btn" id="bgmBtn" aria-label="インストBGM切り替え">♪</button>
  </div>
  <div class="credit">作詞・作曲　大塚陽暉</div>

  <p class="invite">散歩してるときに聴いてみてください。</p>

  <div class="frame">
    <div class="stage" id="stage">
      <div id="player"></div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn" id="loopBtn" aria-label="ループ切り替え">
      <span class="loop-pill"><span id="loopLabel">ループOFF</span></span>
    </button>
  </div>
  <p class="framing"><span class="framing-lead"><span class="keep">大学生のうちに、</span><span class="keep">初めて一人で作詞作曲した曲です。</span></span><br><span class="keep">昔の自分を癒すために作りました。</span></p>
  <div class="route">
    <p class="route-title">完成までの道すじ</p>
    <p class="route-row"><span class="route-date">2024.2.9</span><span>八王子駅でメロディが降ってくる</span></p>
    <p class="route-row"><span class="route-date">2025.8.5</span><span>曲の形が固まる</span></p>
    <p class="route-row"><span class="route-date">2026.8.17</span><span>試作ができる</span></p>
    <p class="route-row"><span class="route-date">2026.11.14</span><span>完成</span></p>
    <p class="route-row"><span class="route-date">2026.11.28</span><span>公開</span></p>
  </div>

  <div class="lyric">
    <p class="card-title">歌詞</p>
    <img src="sanpomichi_lyric_card_clean.png" alt="『さんぽみち』歌詞カード">
  </div>

  <div class="lyric">
    <p class="card-title">録音時に書き込んだメモ</p>
    <img class="paper" src="sanpomichi_lyric_card_annotated.png" alt="『さんぽみち』歌詞カード（書き込みあり）">
  </div>

  <p class="mv-note"><span class="keep">2027年の梅雨の頃に、</span><span class="keep">MVを公開予定です。</span></p>

  <div class="footprint" id="footprint" hidden>
    <button class="footprint-btn" id="footprintBtn" type="button" aria-label="足あとを残す">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="5.6" cy="4.6" rx="1.05" ry="1.35" transform="rotate(-20 5.6 4.6)"/><ellipse cx="8.4" cy="2.9" rx="1.2" ry="1.55"/><ellipse cx="11.7" cy="2.3" rx="1.3" ry="1.65"/><ellipse cx="15.1" cy="2.8" rx="1.2" ry="1.5"/><ellipse cx="17.9" cy="4.4" rx="1.0" ry="1.3" transform="rotate(20 17.9 4.4)"/><ellipse cx="12" cy="9.6" rx="4.4" ry="5.2"/><ellipse cx="12" cy="19.6" rx="3.0" ry="3.0"/></svg>
      <span id="footprintLabel">足あとを残す</span>
    </button>
    <p class="footprint-count" id="footprintCount" hidden><span id="footprintNum">0</span>人が足あとを残しました</p>
  </div>

  <p class="home-row"><a class="home-btn" href="../index.html">ホームへ戻る</a></p>

<script>
  // ★ 公開前にここだけ差し替える：『さんぽみち』限定公開動画のID（11文字）
  var VIDEO_ID = 'hXouq1H6Qv0';
  var player = null, loopOn = false;

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: VIDEO_ID,
      host: 'https://www.youtube-nocookie.com',
      playerVars: {
        rel: 0, modestbranding: 1, playsinline: 1,
        iv_load_policy: 3
      },
      events: { onStateChange: onState }
    });
  }

  function onState(e) {
    if (e.data === YT.PlayerState.PLAYING && bgmOn) {
      setBgm(false);
    }
    if (e.data === YT.PlayerState.ENDED && loopOn) {
      player.seekTo(0);
      player.playVideo();
    }
  }

  document.getElementById('loopBtn').addEventListener('click', function () {
    loopOn = !loopOn;
    document.body.classList.toggle('loop-on', loopOn);
    document.getElementById('loopLabel').textContent = loopOn ? 'ループON' : 'ループOFF';
  });

  // インストBGM（右上のボタン）：クリック起点で <audio> を直接再生する
  var bgm = document.getElementById('bgm');
  var bgmBtn = document.getElementById('bgmBtn');
  var bgmOn = false;
  bgm.volume = 0.25;

  function setBgm(on) {
    bgmOn = on;
    bgmBtn.classList.toggle('on', on);
    if (on) {
      bgm.play();
    } else {
      bgm.pause();
    }
  }

  bgmBtn.addEventListener('click', function () {
    setBgm(!bgmOn);
  });
</script>
<script>
  // 足あとボタン：何人の人が「いいと思ったか」を数える小さなカウンター（Cloudflare Worker + KV）
  // ★Workerデプロイ後に、ここを実際の Worker URL へ差し替える
  var FOOTPRINT_API = 'https://sanpomichi-footprint.ohtsuka-haruki.workers.dev';
  var FP_STORAGE_KEY = 'sanpomichi_footprint_v1';
  (function () {
    var section = document.getElementById('footprint');
    var btn = document.getElementById('footprintBtn');
    var label = document.getElementById('footprintLabel');
    var countLine = document.getElementById('footprintCount');
    var num = document.getElementById('footprintNum');
    if (!section || !btn) return;

    var done = false;
    try { done = localStorage.getItem(FP_STORAGE_KEY) === '1'; } catch (e) {}

    function render(count) {
      section.hidden = false;
      if (typeof count === 'number') {
        num.textContent = count;
        countLine.hidden = !(count >= 1 || done);
      }
      if (done) {
        btn.classList.add('done');
        btn.disabled = true;
        label.textContent = '足あとを残しました';
      }
    }

    // 現在の人数を取得。繋がらない場合はボタン自体を出さない（表示を壊さない）
    fetch(FOOTPRINT_API, { method: 'GET' })
      .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(function (d) { render(d.count); })
      .catch(function () {});

    btn.addEventListener('click', function () {
      if (done) return;
      btn.disabled = true;
      fetch(FOOTPRINT_API, { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
        .then(function (d) {
          done = true;
          try { localStorage.setItem(FP_STORAGE_KEY, '1'); } catch (e) {}
          render(d.count);
        })
        .catch(function () { btn.disabled = false; });
    });
  })();
</script>
